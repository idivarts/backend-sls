name: Deploy Trendly Function

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    name: Trendly Deploy
    runs-on: ubuntu-latest
    # Binds the job to a GitHub Actions Environment (`dev` or `prod`), so
    # `secrets.*` / `vars.*` resolve to that environment's values automatically.
    # Set the same secret/variable names in both Environments (see README).
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    strategy:
      matrix:
        node-version: [20.x]

    env:
      # Still exposed to steps so `--stage ${{ env.STAGE }}` keeps working.
      STAGE: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
      # Shared by the two render-worker steps: one resolves the tag, the other
      # builds into it.
      ECR_REPO: trendly-render-worker
    
    steps:
      - uses: actions/checkout@v3
        with:
          # shared-libs is a submodule now: the render worker imports the design
          # runtime from it, and the Docker build COPYs it. Without this the
          # image build fails on a missing path.
          submodules: true
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22.2 # Set this to the Go version you're using
      - run: npm i
      - run: go version
      - run: go mod download
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Resolve the render worker image
        # Most deploys change Go code and leave the render worker alone, so the
        # ~6 minute arm64-under-QEMU Chromium build is skipped unless the image
        # would actually come out different.
        #
        # "Different" is decided by CONTENT, not by a commit range: the tag IS
        # the hash of every path the Dockerfile COPYs, so an identical worker
        # always resolves to the tag that is already in ECR. A `git diff` against
        # the previous commit would get this wrong in all the cases that matter
        # — the first deploy, a re-run of a failed job, a force-push (where
        # github.event.before is 000000), and a revert, which should go straight
        # back to the image that was already built for that content.
        #
        # The tag carries no stage: the image has no stage-specific content (env
        # comes from the Lambda, not the layer), so dev and prod deliberately
        # share one artifact and a prod deploy reuses the exact bytes dev ran.
        id: render_image
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          # Git tree hashes, so this covers every file under those paths —
          # including the Dockerfile, which lives inside services/render-worker.
          # shared-libs is a submodule, hence the separate -C lookup; if it is
          # not checked out this fails loudly rather than reusing a stale image.
          WORKER_TREE=$(git rev-parse "HEAD:services/render-worker")
          DESIGN_TREE=$(git -C shared-libs rev-parse "HEAD:design")

          # How the image is BUILT is an input too, not just what goes into it.
          # Bump RECIPE whenever the buildx invocation below changes in a way
          # that changes the artifact — otherwise an identical worker resolves to
          # a tag that already exists and the new flags never take effect, which
          # is exactly how a bad manifest survived one deploy. Not the workflow
          # file's own hash, so editing an unrelated step doesn't force a rebuild.
          #   1 = original
          #   2 = --provenance=false (single image manifest; Lambda rejects an index)
          RECIPE=2

          TAG="src-$(printf '%s %s %s' "$WORKER_TREE" "$DESIGN_TREE" "$RECIPE" | sha256sum | cut -c1-16)"

          echo "RENDER_IMAGE_URI=$REGISTRY/$ECR_REPO:$TAG" >> "$GITHUB_ENV"
          echo "uri=$REGISTRY/$ECR_REPO:$TAG" >> "$GITHUB_OUTPUT"

          # A missing repository fails this the same way a missing tag does, so
          # the build step below still handles first-run creation.
          if aws ecr describe-images --repository-name "$ECR_REPO" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Render worker::Unchanged — reusing $TAG"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Render worker::Changed — building $TAG"
          fi
      - name: Set up QEMU
        if: steps.render_image.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.render_image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and push the render worker image
        # Built for linux/arm64 to match provider.architecture and to take the
        # Graviton discount on both Lambda and Fargate. The ECR repository is
        # created on first run rather than declared in the stack: the Lambda
        # references the image by URI, so the image has to exist BEFORE
        # `sls deploy` runs — a repo created by the same stack would deadlock.
        if: steps.render_image.outputs.build == 'true'
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE_URI%%/*}"
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPO" \
                 --image-scanning-configuration scanOnPush=true >/dev/null
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          # --provenance=false is load-bearing, not hygiene. With it on (the
          # buildx default when pushing) BuildKit publishes an OCI image INDEX
          # carrying the arm64 manifest plus an attestation-manifest, and Lambda
          # rejects an index outright: "The image manifest, config or layer media
          # type for the source image ... is not supported." Batch and ECS accept
          # it, which is why only the Lambda front door broke. --sbom=false is
          # already the default and is stated so nothing turns it on later.
          docker buildx build --platform linux/arm64 \
            --provenance=false --sbom=false \
            -f services/render-worker/Dockerfile \
            -t "$IMAGE_URI" --push .
        env:
          IMAGE_URI: ${{ steps.render_image.outputs.uri }}
      - name: Add Service JSON and Deploy
        env:
          # Schema-less WS API Gateway host, picked per-stage from org-level action variables
          WEBSOCKET_TRENDLY: ${{ env.STAGE == 'prod' && vars.WEBSOCKET_PROD_TRENDLY || vars.WEBSOCKET_DEV_TRENDLY }}
          FIRESTORE_DATABASE_ID: ${{ env.STAGE == 'prod' && vars.FIRESTORE_DATABASE_PROD_ID || vars.FIRESTORE_DATABASE_DEV_ID }}
          # One Sentry project for both stages — dev and prod are separated by the
          # `environment` tag (pkg/mysentry reads STAGE), not by separate DSNs.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          JWT_ENCODE_KEY: ${{ secrets.JWT_ENCODE_KEY }}
          FB_CLIENT_ID: ${{ vars.FB_CLIENT_ID }}
          FB_CLIENT_SECRET: ${{ secrets.FB_CLIENT_SECRET }}
          INSTA_CLIENT_ID: ${{ vars.INSTA_CLIENT_ID }}
          INSTA_CLIENT_SECRET: ${{ secrets.INSTA_CLIENT_SECRET }}
          # Social webhooks — per-platform subscription verify tokens (secrets) +
          # strict-signature gate (non-sensitive boolean toggle → variable)
          WEBHOOK_VERIFY_TOKEN_INSTAGRAM: ${{ secrets.WEBHOOK_VERIFY_TOKEN_INSTAGRAM }}
          WEBHOOK_VERIFY_TOKEN_FACEBOOK: ${{ secrets.WEBHOOK_VERIFY_TOKEN_FACEBOOK }}
          WEBHOOK_STRICT_SIGNATURE: ${{ vars.WEBHOOK_STRICT_SIGNATURE }}
          # RevenueCat native IAP webhook auth (see docs/revenuecat-iap-setup.md)
          REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
          TWITTER_CLIENT_ID: ${{ vars.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
          STREAM_SECRET: ${{ secrets.STREAM_SECRET }}
          # Email sends via Amazon SES, authenticated by the Lambda execution
          # role — no key needed. SENDGRID_API_KEY remains only for the
          # marketing-contacts sync. See docs/ses-setup.md.
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.TRENDLY_SERVICE_ACCOUNT }}
          TRENDLY_KEY_SECRETS_BASE64: ${{ env.STAGE == 'dev' && secrets.TRENDLY_DEV_KEY_SECRETS || secrets.TRENDLY_PROD_KEY_SECRETS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # This uses the secret stored in GitHub
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # AI Studio — ElevenLabs (music + voiceover) and Canva Connect bridge.
          # ELEVENLABS_API_KEY + CANVA_CLIENT_SECRET are secrets; CANVA_CLIENT_ID +
          # CANVA_REDIRECT_URI are non-secret vars.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CANVA_CLIENT_ID: ${{ vars.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REDIRECT_URI: ${{ vars.CANVA_REDIRECT_URI }}
          # Branch deep links (pkg/branch). Environment-scoped vars/secrets, so the
          # `environment:` binding above picks the TEST Branch app on dev and the
          # LIVE one on prod — no per-stage ternary needed here.
          BRANCH_BRAND_KEY: ${{ vars.BRANCH_BRAND_KEY }}
          BRANCH_BRAND_SECRET: ${{ secrets.BRANCH_BRAND_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          # Dedicated LinkedIn Community Management API app (linkedin_page provider).
          LINKEDIN_CM_CLIENT_ID: ${{ vars.LINKEDIN_CM_CLIENT_ID }}
          LINKEDIN_CM_CLIENT_SECRET: ${{ secrets.LINKEDIN_CM_CLIENT_SECRET }}
          # Reddit Data API (confidential OAuth app). REDDIT_USER_AGENT is a
          # non-secret variable; Reddit requires it to be unique + descriptive.
          REDDIT_CLIENT_ID: ${{ vars.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
        run: |
          echo $FIREBASE_SERVICE_ACCOUNT_BASE64 | base64 -d > service-account.json
          echo $TRENDLY_KEY_SECRETS_BASE64 | base64 -d > key-secrets.json
          # The Node render worker can't read the bundled service-account.json
          # (it is packaged with the Go functions), so the same credential is
          # handed to it as an environment value.
          export FIREBASE_SERVICE_ACCOUNT_JSON="$(cat service-account.json)"
          npm run build:trendly
          npx sls deploy --config serverless.trendly.yml --stage ${{ env.STAGE }}