service: trendly-be
frameworkVersion: "3"

provider:
  name: aws
  stage: ${opt:stage, 'dev'}
  architecture: arm64
  runtime: provided.al2
  versionFunctions: true  # Enables versioning of Lambda functions
  environment:
    STAGE: ${self:provider.stage}
    GIN_MODE: ${self:custom.ginMode.${self:provider.stage}}
    FIRESTORE_DATABASE_ID: ${env:FIRESTORE_DATABASE_ID, '(default)'}
    # Error reporting (pkg/mysentry). Empty ⇒ every capture is a silent no-op,
    # so an unconfigured stage deploys and runs exactly as before.
    SENTRY_DSN: ${env:SENTRY_DSN, ''}
    VIDEO_S3_BUCKET_NAME: ${self:service}-video-uploads
    IMAGE_S3_BUCKET_NAME: ${self:service}-image-uploads
    ATTACHMENT_S3_BUCKET_NAME: ${self:service}-attachment-uploads
    CLOUDFRONT_DISTRIBUTION_URL: https://d2x6j6vtsfyq7w.cloudfront.net
    IMAGE_CF_DISTRIBUTION_URL: https://d1tfun8qrz04mk.cloudfront.net
    ATTACHMENT_CF_DISTRIBUTION_URL: https://d1u20zdoqkyuuq.cloudfront.net
    # WEBSOCKET_TRENDLY is the schema-less WS API Gateway host (e.g. cuowcrxmii.execute-api.us-east-1.amazonaws.com/dev)
    # passed in per-stage from GitHub Actions (org vars WEBSOCKET_DEV_TRENDLY / WEBSOCKET_PROD_TRENDLY).
    WS_GATEWAY_ENDPOINT: https://${env:WEBSOCKET_TRENDLY, 'cuowcrxmii.execute-api.us-east-1.amazonaws.com/dev'}
    STREAM_CLIENT: gg9xameygwse
    STREAM_SECRET: ${env:STREAM_SECRET}
    JWT_ENCODE_KEY: ${env:JWT_ENCODE_KEY}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    OPENROUTER_API_KEY: ${env:OPENROUTER_API_KEY, ''}
    # AI Studio — ElevenLabs (music + voiceover) and Canva Connect deep-edit
    # bridge. See docs/elevenlabs-setup.md and docs/canva-setup.md.
    ELEVENLABS_API_KEY: ${env:ELEVENLABS_API_KEY, ''}
    CANVA_CLIENT_ID: ${env:CANVA_CLIENT_ID, ''}
    CANVA_CLIENT_SECRET: ${env:CANVA_CLIENT_SECRET, ''}
    CANVA_REDIRECT_URI: ${env:CANVA_REDIRECT_URI, 'https://be.trendly.now/api/integrations/canva/callback'}
    # Async scene render worker queue (Fargate consumer). Empty ⇒ enqueue is a
    # no-op (FE renders scene previews itself). See docs/render-worker.md.
    # ── Branch deep links (pkg/branch) — public share links for strategy /
    #    calendar / content. BRANCH_BRAND_* is the BRAND app's Branch app; the
    #    influencer app gets its own BRANCH_USER_* pair when it needs one.
    #    The key is non-secret (it ships in the mobile bundle) and comes from a
    #    GitHub Actions ENVIRONMENT variable, so dev gets the test Branch app and
    #    prod the live one under the same names. Empty ⇒ sharing silently falls
    #    back to the plain web URL.
    #    The link domain is NOT configured here: Branch decides it from the app's
    #    default link domain in its dashboard, and the create response carries the
    #    finished URL.
    BRANCH_BRAND_KEY: ${env:BRANCH_BRAND_KEY, ''}
    BRANCH_BRAND_SECRET: ${env:BRANCH_BRAND_SECRET, ''}
    BRAND_LOGIN_URL: "/login"
    SELF_BASE_URL: "https://be.trendly.now"
    # ── Outbound email (Amazon SES) — see docs/ses-setup.md ─────────────────
    EMAIL_SENDER_NAME: Trendly
    EMAIL_SENDER_ADDRESS: no-reply@updates.trendly.now
    EMAIL_REPLY_TO: support@trendly.now
    SES_REGION: ${aws:region}
    # Created by the EmailConfigurationSet resource below — one per stage, so
    # dev and prod keep separate bounce/complaint event streams.
    SES_CONFIGURATION_SET: !Ref EmailConfigurationSet
    # SendGrid no longer sends mail. This key is still required by the marketing
    # -contacts sync in pkg/mysendgrid/contact.go, which SES cannot replace —
    # see docs/ses-setup.md §8.
    SENDGRID_API_KEY: ${env:SENDGRID_API_KEY}
    HUBSPOT_API_KEY: ${env:HUBSPOT_API_KEY}
    # RevenueCat native IAP webhook shared secret. Must match the Authorization
    # header value configured in the RevenueCat dashboard webhook. See the IAP
    # ticket + docs/revenuecat-iap-setup.md.
    REVENUECAT_WEBHOOK_AUTH: ${env:REVENUECAT_WEBHOOK_AUTH, ''}
    # Social Connect V2 — new OAuth platform credentials
    FB_CLIENT_ID: ${env:FB_CLIENT_ID, '567254166026958'}
    FB_CLIENT_SECRET: ${env:FB_CLIENT_SECRET}
    INSTA_CLIENT_ID: ${env:INSTA_CLIENT_ID, '1166596944824933'}
    INSTA_CLIENT_SECRET: ${env:INSTA_CLIENT_SECRET}
    # Social webhooks (trendly_social_webhooks) — per-platform subscription verify
    # tokens (must match the Verify Token typed into each Meta webhook config) and
    # the strict-signature gate (leave unset during initial testing).
    WEBHOOK_VERIFY_TOKEN_INSTAGRAM: ${env:WEBHOOK_VERIFY_TOKEN_INSTAGRAM, 'mytoken'}
    WEBHOOK_VERIFY_TOKEN_FACEBOOK: ${env:WEBHOOK_VERIFY_TOKEN_FACEBOOK, 'mytoken'}
    WEBHOOK_STRICT_SIGNATURE: ${env:WEBHOOK_STRICT_SIGNATURE, ''}
    YOUTUBE_CLIENT_ID: ${env:YOUTUBE_CLIENT_ID, ''}
    YOUTUBE_CLIENT_SECRET: ${env:YOUTUBE_CLIENT_SECRET, ''}
    LINKEDIN_CLIENT_ID: ${env:LINKEDIN_CLIENT_ID, ''}
    LINKEDIN_CLIENT_SECRET: ${env:LINKEDIN_CLIENT_SECRET, ''}
    # Dedicated Community Management API app (Company Pages / linkedin_page
    # provider) — MUST be a separate LinkedIn app (CMA must be its only product).
    # See docs/linkedin-pages-cma-setup.md.
    LINKEDIN_CM_CLIENT_ID: ${env:LINKEDIN_CM_CLIENT_ID, ''}
    LINKEDIN_CM_CLIENT_SECRET: ${env:LINKEDIN_CM_CLIENT_SECRET, ''}
    TWITTER_CLIENT_ID: ${env:TWITTER_CLIENT_ID, ''}
    TWITTER_CLIENT_SECRET: ${env:TWITTER_CLIENT_SECRET, ''}
    # Reddit Data API (OAuth confidential web app). REDDIT_USER_AGENT is mandatory
    # and must be unique — Reddit bans generic/spoofed UAs. See
    # docs/social-expansion-dashboard-setup.md §4.
    REDDIT_CLIENT_ID: ${env:REDDIT_CLIENT_ID, ''}
    REDDIT_CLIENT_SECRET: ${env:REDDIT_CLIENT_SECRET, ''}
    REDDIT_USER_AGENT: ${env:REDDIT_USER_AGENT, 'web:trendly-ai-social-planner:v1.0 (by /u/trendlyapp)'}
    # All Razorpay related variables
    GROWTH_PLAN_ID: plan_QywVXV2flgIY7N
    BUSINESS_PLAN_ID: plan_QywX8bnObf3P42
    COLLAB_BOOST_AMOUNT: 799
    COLLAB_HANDLING_LINK: https://rzp.io/rzp/collaboration-handling-support
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "mediaconvert:CreateJob"
            - "mediaconvert:GetJob"
            - "mediaconvert:ListJobs"
            - "mediaconvert:CancelJob"
            - "mediaconvert:DescribeEndpoints"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "s3:GetObject"
            - "s3:PutObject"
            - "s3:ListBucket"
          Resource: 
            - arn:aws:s3:::trendly-discovery-bucket
            - arn:aws:s3:::trendly-discovery-bucket/*
            - arn:aws:s3:::${self:service}-video-uploads
            - arn:aws:s3:::${self:service}-video-uploads/*
            - arn:aws:s3:::${self:service}-image-uploads
            - arn:aws:s3:::${self:service}-image-uploads/*
            - arn:aws:s3:::${self:service}-attachment-uploads
            - arn:aws:s3:::${self:service}-attachment-uploads/*
        - Effect: "Allow"
          Action:
            - "iam:PassRole"
          Resource: arn:aws:iam::730335628944:role/service-role/MediaConvert_Default_Role
        - Effect: "Allow"
          Action:
            - "sqs:sendmessage"
          Resource: { "Fn::GetAtt": ["DiscoveryMessageQueue", "Arn"] }
        - Effect: "Allow"
          Action:
            - "execute-api:ManageConnections"
          Resource: "arn:aws:execute-api:*:*:*/@connections/*"
        # ── Scheduled content publishing: drive the delayed-publish state machine + queue ──
        - Effect: "Allow"
          Action:
            - "states:StartExecution"
            - "states:StopExecution"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "sqs:SendMessage"
          Resource: { "Fn::GetAtt": ["ContentPublishQueue", "Arn"] }
        # ── Social sync: hand slow Meta work (inbox/analytics/media) to social_sqs ──
        - Effect: "Allow"
          Action:
            - "sqs:SendMessage"
          Resource: { "Fn::GetAtt": ["SocialSyncQueue", "Arn"] }
        # ── Design rendering: images go to SQS, video goes straight to Batch ──
        #    (Batch IS the queue for video — it already provides ordering,
        #    retries and Spot-interruption handling.)
        - Effect: "Allow"
          Action:
            - "sqs:SendMessage"
          Resource: { "Fn::GetAtt": ["ImageRenderQueue", "Arn"] }
        - Effect: "Allow"
          Action:
            - "batch:SubmitJob"
          Resource:
            - { "Ref": "RenderJobQueue" }
            - { "Ref": "RenderJobDefinition" }
        # ── Outbound email via Amazon SES (pkg/myemail). Scoped to the verified
        #    sending identity + the transactional configuration set. See
        #    docs/ses-setup.md. ──
        - Effect: "Allow"
          Action:
            - "ses:SendEmail"
          Resource:
            - "arn:aws:ses:${aws:region}:${aws:accountId}:identity/updates.trendly.now"
            - "arn:aws:ses:${aws:region}:${aws:accountId}:configuration-set/trendly-transactional-${self:provider.stage}"
plugins:
  - serverless-go-plugin
  - serverless-domain-manager
  - serverless-certificate-creator
  # - serverless-plugin-typescript

custom:
  go:
    baseDir: . # folder where go.mod file lives, if set `handler` property should be set relatively to that folder
    binDir: .bin # target folder for binary files
    cgo: 0 # CGO_ENABLED flag
    cmd: GOARCH=arm64 GOOS=linux go build -tags lambda.norpc # compile command
    monorepo: false # if enabled, builds function every directory (useful for monorepo where go.mod is managed by each function
    supportedRuntimes: ["provided.al2"] # the plugin compiles a function only if runtime is declared here (either on function or provider level)
    buildProvidedRuntimeAsBootstrap: true # if enabled, builds and archive function with only single "bootstrap" binary (useful for runtimes like provided.al2)
  customCertificate:
    certificateName: "be.trendly.now"
    hostedZoneIds: Z02250033690XMWB8LXL7
    enabled: true
    rewriteRecords: false
  basePathMap:
    dev: dev
    prod: ""
  isProd:
    dev: false
    prod: true
  ginMode:
    dev: debug
    prod: release
  customDomain:
    domainName: be.trendly.now
    basePath: ${self:custom.basePathMap.${self:provider.stage}}
    stage: ${self:provider.stage}
    apiType: rest
    certificateName: "be.trendly.now"
    createRoute53Record: true
    createRoute53IPv6Record: true
    endpointType: "regional"
    securityPolicy: tls_1_2

functions:
  # sendgrid_sync:
  #   handler: scripts/sync-sengrid/main.go
  #   package:
  #     include:
  #       - 'service-account.json'
  #       - 'key-secrets.json'
