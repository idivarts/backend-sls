  #     - schedule:
  #         rate: cron(0 12 * * ? *)  # Runs every day at 12:00 PM UTC
  #         enabled: ${self:custom.isProd.${self:provider.stage}}
  matchmaking:
    handler: scripts/matchmaking/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
    timeout: 900
    events:
      - schedule:
          rate:
            - cron(30 2 * * ? *)   # 8:00 AM IST daily
            - cron(30 14 * * ? *)  # 8:00 PM IST daily
          # enabled: ${self:custom.isProd.${self:provider.stage}}
  billing_cron:
    handler: scripts/billing-cron/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
    timeout: 900  # 15 min — scans all orgs to renew wallets + advance billing state
    memorySize: 256
    description: "1st-of-month org billing: token-wallet renewal + lock/invoice state machine"
    events:
      - schedule:
          rate: cron(0 2 1 * ? *)  # 02:00 UTC on the 1st of every month
          # enabled: ${self:custom.isProd.${self:provider.stage}}
  render_reconcile:
    handler: functions/trendly_render_reconcile/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
    timeout: 300
    memorySize: 256
    description: "Fails renders that stopped reporting, so nothing waits on a dead job"
    events:
      - schedule:
          rate: cron(*/15 * * * ? *)  # every 15 minutes
  social_token_refresh:
    handler: functions/trendly_social_refresh/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
    timeout: 900  # 15 min — can scan many users
    memorySize: 256
    description: "Refreshes expiring social platform OAuth tokens (runs every 6h)"
    events:
      - schedule:
          rate: cron(0 */6 * * ? *)  # Every 6 hours
          # enabled: true
  analytics_snapshot:
    handler: functions/trendly_analytics_snapshot/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
    timeout: 900  # 15 min — scans all brands' connected Meta accounts
    memorySize: 256
    description: "Daily top-line social analytics snapshot for trend graphs"
    events:
      - schedule:
          rate: cron(0 1 * * ? *)  # Every day at 01:00 UTC
          # enabled: ${self:custom.isProd.${self:provider.stage}}
  trendly_discovery:
    handler: functions/trendly_discovery/main.go
    environment:
      SEND_MESSAGE_QUEUE_ARN: 
        Fn::GetAtt:
          - DiscoveryMessageQueue
          - QueueName
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - http: ANY /discovery/{proxy+}
  # trendly_discovery_script:
  #   handler: scripts/socials-update-images/main.go
  #   environment:
  #     S3_BUCKET: trendly-discovery-bucket
  #     S3_URL: https://trendly-discovery-bucket.s3.us-east-1.amazonaws.com
  #   package:
  #     include:
  #       - 'service-account.json'
  #       - 'key-secrets.json'
  #       - 'templates/*'
  #   timeout: 900
  #   events:
  #     - schedule:
  #         rate: cron(30 0 * * ? *)  # Runs daily at 6:00 AM IST (00:30 UTC)
  #         enabled: ${self:custom.isProd.${self:provider.stage}}
  trendly_discovery_upload:
    handler: scripts/socials-add-entries/main.go
    environment:
      S3_BUCKET: trendly-discovery-bucket
      S3_URL: https://trendly-discovery-bucket.s3.us-east-1.amazonaws.com
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 900
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - DiscoveryMessageQueue
              - Arn
  trendly_contracts:
    handler: functions/trendly_monetize/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - http: ANY /monetize/{proxy+}
  # trendly_apis:
  #   handler: functions/trendly_apis/main.go
  #   package:
  #     include:
  #       - 'service-account.json'
  #       - 'key-secrets.json'
  #       - 'templates/*'
  #   timeout: 30
  #   events:
  #     - http: ANY /api/v1/{proxy+}
  trendly_v2_apis:
    handler: functions/trendly_v2/main.go
    environment:
      # Scheduled content publishing — drives the delayed-publish state machine.
      DELAY_STATE_FUNCTION:
        Fn::GetAtt:
          - ContentPublishStateMachine
          - Arn
      SEND_MESSAGE_QUEUE_ARN:
        Ref: ContentPublishQueue   # Ref returns the queue URL (QueueUrl for sqs:sendMessage)
      SOCIAL_SYNC_QUEUE_URL:
        Ref: SocialSyncQueue       # shared async queue for slow Meta work (see social_sqs worker)
      # Server-side design rendering. Without these the render route reports a
      # clear "not configured" error rather than silently accepting a job that
      # no worker will ever pick up.
      IMAGE_RENDER_QUEUE_URL:
        Ref: ImageRenderQueue      # Ref returns the queue URL
      VIDEO_RENDER_JOB_QUEUE:
        Ref: RenderJobQueue
      VIDEO_RENDER_JOB_DEFINITION:
        Ref: RenderJobDefinition
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - http: ANY /api/v2/{proxy+}
  trendly_collabs_apis:
    handler: functions/trendly_collabs/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - http: ANY /api/collabs/{proxy+}
  trendly_ai_apis:
    handler: functions/trendly_ai/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - http: ANY /api/ai/{proxy+}
      - http: ANY /api/content-strategy/{proxy+}
  trendly_studio_apis:
    handler: functions/trendly_studio/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      # ElevenLabs audio (music + voiceover) and Canva Connect deep-edit bridge.
      - http: ANY /api/media/{proxy+}
      - http: ANY /api/integrations/canva/{proxy+}
  trendly_matchmaking_apis:
    handler: functions/trendly_matchmaking/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    # provisionedConcurrency: 1  # Adjust this number as per traffic/load
    events:
      - http: ANY /api/matchmaking/{proxy+}
  trendly_influencers_apis:
    handler: functions/trendly_influencers/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - http: ANY /api/influencers/{proxy+}
  trendly_razorpay_apis:
    handler: functions/razorpay/apis/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    # provisionedConcurrency: 1  # Adjust this number as per traffic/load
    events:
      - http: ANY /razorpay/{proxy+}
  trendly_payment_webhooks:
    handler: functions/razorpay/webhook/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    # provisionedConcurrency: 1  # Adjust this number as per traffic/load
    events:
      - http: ANY /payment_webhooks
  trendly_revenuecat_webhook:
    handler: functions/revenuecat/webhook/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - http: ANY /revenuecat/webhook
  trendly_social_webhooks:
    handler: functions/trendly_social_webhooks/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - http: ANY /webhooks/{proxy+}
  stream_sqs_hook:
    handler: functions/stream_sqs_hook/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - StreamMessageQueue
              - Arn
  scheduled_publish_sqs:
    handler: functions/scheduled_publish_sqs/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    # Also serves instant publish-now / retry jobs, which publish to every
    # destination concurrently and may upload large video (YouTube/IG/FB) — well
    # beyond the 30s HTTP limit, hence the queue. Set to the Lambda max (900s) so a
    # slow multi-platform video fan-out (incl. LinkedIn's up-to-120s processing
    # wait) never times out mid-publish.
    timeout: 900
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - ContentPublishQueue
              - Arn
  social_sqs:
    handler: functions/social_sqs/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 600   # Meta work (inbox/analytics/media) makes many sequential Graph calls; far above the 30s HTTP limit
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - SocialSyncQueue
              - Arn
  insta_apis:
    handler: functions/unauth_apis/main.go
    environment:
      # Social Connect (/connect/*) runs here. On a successful brand connect it
      # enqueues warm-up jobs (inbox DMs + media + analytics) onto the shared
      # social-sync queue so those caches fill in the background immediately —
      # without this URL the enqueue silently no-ops and the fetch would only
      # start on first inbox open. Mirrors trendly_v2_apis.
      SOCIAL_SYNC_QUEUE_URL:
        Ref: SocialSyncQueue
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    timeout: 30
    # provisionedConcurrency: 1  # Adjust this number as per traffic/load
    events:
      - http: ANY /instagram
      - http: ANY /instagram/{proxy+}
      - http: ANY /firebase
      - http: ANY /firebase/{proxy+}
      - http: ANY /onboard
      - http: ANY /onboard/{proxy+}
      # Public free AI tools for the marketing website
      - http: ANY /tools
      - http: ANY /tools/{proxy+}
      # Social Connect V2 portal routes
      - http: ANY /connect
      - http: ANY /connect/{proxy+}
  t_websocket:
    handler: functions/websocket/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    # AI chat turns run synchronously in this lambda (see internal/websocket
    # receive.go → ai.HandleWS). A turn with several agentic tool steps +
    # image/design generation can run for minutes, so we allow the lambda max
    # (900s) rather than cutting a live turn off at 5 minutes. Streaming reaches
    # the client out-of-band via PostToConnection, so the API Gateway 29s
    # integration timeout does not apply.
    timeout: 900
    events:
      - websocket: $connect
      - websocket: $disconnect
      - websocket: $default
  s3:
    handler: functions/s3/main.go
    package:
      include:
        - 'service-account.json'
        - 'key-secrets.json'
        - 'templates/*'
    events:
      - http: ANY /s3/v1/{proxy+}
  # processVideoUpload:
  #   handler: functions/process_video/main.go
  #   environment:
  #     MEDIACONVERT_ROLE_ARN: arn:aws:iam::730335628944:role/service-role/MediaConvert_Default_Role
  #     MEDIACONVERT_JOBTEMPLATE_ARN: arn:aws:mediaconvert:us-east-1:730335628944:jobTemplates/System-Ott_Cmaf_Cmfc_Avc_Aac_Sdr_Cbr
  #     MEDIACONVERT_JOBQUEUE_ARN: arn:aws:mediaconvert:us-east-1:730335628944:queues/Default
  #   events:
  #     - s3:
  #         bucket: ${self:service}-video-uploads
  #         event: s3:ObjectCreated:*
  #         existing: true
  #         rules:
  #           - prefix: "uploads/"  # Only triggers when an object is uploaded directly in the root
            
  # ── Design render worker (images) ─────────────────────────────────────────
  # A CONTAINER function, not a Go handler: it runs the Node worker image that
  # carries Chromium and FFmpeg. Images get Lambda rather than Batch purely
  # because of billing shape — Fargate bills a one-minute minimum AND bills the
  # image pull, so a four-second carousel would cost like a sixty-second job and
  # make the user wait ~35s before rendering even starts.
  #
  # ENTRYPOINT is overridden because, unlike a Go binary, Node does not implement
  # the Lambda Runtime API itself — lambda-bootstrap.js is the worker's own
  # long-poll loop against it. The same image runs unmodified on Batch, where the
  # default ENTRYPOINT (cli.js) applies.
  #
  # RENDER_IMAGE_URI is pushed by CI before `sls deploy` — see the container
  # build step in .github/workflows/deploy-trendly.yaml.
  render_image:
    # NOT the managed Node runtime — this is a container function and Serverless
    # drops `runtime` entirely for one (it only emits Runtime on the zip path, so
    # this never reaches CloudFormation). It is here purely to opt out of
    # serverless-go-plugin: the plugin builds any function whose runtime — its
    # own or the provider's — is in custom.go.supportedRuntimes, and inheriting
    # provider.runtime: provided.al2 made it try `go build -o .bin/render_image
    # undefined` on a function that has no Go handler at all.
    runtime: nodejs20.x
    image:
      uri: ${env:RENDER_IMAGE_URI, ''}
      # The image's own Runtime API loop, not aws-lambda-ric — see
      # services/render-worker/src/lambda-bootstrap.ts for why. It takes no
      # handler argument, so there is no `command` to override.
      entryPoint: ["node", "dist/services/render-worker/src/lambda-bootstrap.js"]
    # 4 GB buys ~2.3 vCPU, which is what makes Chromium start fast; the cost of
    # the extra memory is more than repaid by the shorter run.
    memorySize: 4096
    timeout: 120
    # A cap, not a target: renders are bursty and this keeps a bad day bounded.
    reservedConcurrency: 20
    # Environment is NOT declared here. Serverless merges provider.environment
    # into every function, and all 55 Go secrets plus the 2.4 KB service-account
    # JSON came to 5512 bytes — past Lambda's hard 4 KB ceiling. The worker reads
    # five variables, so they are set as a wholesale REPLACEMENT further down, in
    # `resources.extensions.RenderUnderscoreimageLambdaFunction`. Keep them there.
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - ImageRenderQueue
              - Arn
          # One message per invocation: a thrown error then fails exactly that
          # render, SQS redrives it, and the DLQ catches anything that keeps
          # failing — rather than one bad design poisoning a batch of ten.
          batchSize: 1

package:
  patterns:
    - "!./**"
  individually: true

resources:
  # ── Container function environment (replaces, does not extend) ─────────────
  # Serverless merges provider.environment into every function and offers no
  # per-function opt-out. For the Go functions that is exactly right; for the
  # render worker it meant inheriting all 55 shared secrets on top of the 2.4 KB
  # service-account JSON — 5512 bytes against Lambda's hard 4 KB limit, so the
  # function could not be created at all.
  #
  # An extension's `Properties` are applied with Object.assign, which is shallow,
  # so naming `Environment` here REPLACES the compiled one rather than merging
  # into it (serverless/lib/plugins/aws/package/lib/merge-custom-provider-resources.js).
  # That is the only way to shrink a single function's environment, and it also
  # makes the worker permanently immune to provider.environment growing again.
  #
  # The list below is the worker's whole surface — services/render-worker/src/config.ts
  # plus firestore.ts — and deliberately mirrors RenderJobDefinition's Environment,
  # since the same image runs on Batch. AWS_REGION is injected by Lambda itself.
  extensions:
    RenderUnderscoreimageLambdaFunction:
      Properties:
        Environment:
          Variables:
            ATTACHMENT_S3_BUCKET_NAME: ${self:service}-attachment-uploads
            ATTACHMENT_CF_DISTRIBUTION_URL: https://d1u20zdoqkyuuq.cloudfront.net
            FIRESTORE_DATABASE_ID: ${env:FIRESTORE_DATABASE_ID, '(default)'}
            FIREBASE_SERVICE_ACCOUNT_JSON: ${env:FIREBASE_SERVICE_ACCOUNT_JSON, ''}
            RENDER_SCALE: ${env:RENDER_SCALE, '1'}

  Conditions:
    IsDev:
      Fn::Equals: ["${sls:stage}", "dev"]
    IsProd:
      Fn::Equals: ["${sls:stage}", "prod"]

  Resources:
    # ── Outbound email (Amazon SES) ─────────────────────────────────────────
    # The configuration set is what makes delivery/bounce/complaint events
    # observable — SES does NOT create one for you, and a send naming a set that
    # does not exist fails outright. Creating it here keeps it in lockstep with
    # the IAM policy that references it. The sending IDENTITY (the verified
    # domain + its DKIM/MAIL FROM DNS) is still a manual, one-time setup —
    # see docs/ses-setup.md.
    EmailConfigurationSet:
      Type: AWS::SES::ConfigurationSet
      Properties:
        Name: trendly-transactional-${self:provider.stage}
        ReputationOptions:
          ReputationMetricsEnabled: true
        SendingOptions:
          SendingEnabled: true

    EmailEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-email-events-${self:provider.stage}
        DisplayName: Trendly SES delivery events

    # SES publishes as a service principal, so it needs an explicit grant on the
    # topic; without this the event destination silently delivers nothing.
    EmailEventsTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - !Ref EmailEventsTopic
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ses.amazonaws.com
              Action: "sns:Publish"
              Resource: !Ref EmailEventsTopic
              Condition:
                StringEquals:
                  AWS:SourceAccount: ${aws:accountId}

    EmailConfigurationSetEventDestination:
      Type: AWS::SES::ConfigurationSetEventDestination
      Properties:
        ConfigurationSetName: !Ref EmailConfigurationSet
        EventDestination:
          Name: sns-delivery-events
          Enabled: true
          MatchingEventTypes:
            - send
            - reject
            - bounce
            - complaint
            - delivery
            - renderingFailure
          SnsDestination:
            TopicARN: !Ref EmailEventsTopic

    DiscoveryMessageQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: DiscoveryMessageQueue-${self:provider.stage}
        VisibilityTimeout: 900

    StreamMessageDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: StreamMessageDLQ-${self:provider.stage}

    StreamMessageQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: StreamMessageQueue-${self:provider.stage}
        VisibilityTimeout: 60
        MaximumMessageSize: 262144  # 256 KB
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - StreamMessageDLQ
              - Arn
          maxReceiveCount: 5

    # --------------------------------------------------------------------------------------
    # --- Shared social sync (Meta inbox/analytics/media) — consumed by social_sqs worker ---
    # --------------------------------------------------------------------------------------
    SocialSyncQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: SocialSyncQueue-${self:provider.stage}
        VisibilityTimeout: 660   # ≥ social_sqs timeout (600s) + buffer

    # ══════════════════════════════════════════════════════════════════════
    # Server-side design rendering
    # ══════════════════════════════════════════════════════════════════════
    # Replaces the orphaned SceneRenderQueue, which belonged to the deleted
    # CanvasKit scene-graph plan and was never consumed by anything.
    #
    # Two lanes, one container image:
    #   images → ImageRenderQueue → the render_image Lambda
    #   video  → RenderJobQueue (Batch) → a Fargate Spot task that exits
    #
    # Nothing runs while nothing is queued, so idle cost is zero. The only
    # standing charges are ECR image storage and, while a task is actually
    # running, its public IPv4 (~$0.005/hr, about $0.0001 per render).

    ImageRenderDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ImageRenderDLQ-${self:provider.stage}
        MessageRetentionPeriod: 1209600   # 14 days, to debug a bad design slowly

    ImageRenderQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ImageRenderQueue-${self:provider.stage}
        VisibilityTimeout: 180   # >= render_image timeout (120s) + buffer
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - ImageRenderDLQ
              - Arn
          maxReceiveCount: 3

    # ── Network ───────────────────────────────────────────────────────────
    # Fargate tasks must live in a VPC; every Lambda in this stack runs outside
    # one, so this VPC exists ONLY for the render tasks. Public subnets with
    # assignPublicIp, deliberately: a NAT gateway would cost ~$32/month whether
    # or not anything renders, which defeats the point of a queue that scales to
    # zero. The S3 gateway endpoint (free) keeps uploads off the public path.
    RenderVpc:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: 10.42.0.0/16
        EnableDnsSupport: true
        EnableDnsHostnames: true
        Tags:
          - Key: Name
            Value: trendly-render-${self:provider.stage}

    RenderInternetGateway:
      Type: AWS::EC2::InternetGateway

    RenderVpcGatewayAttachment:
      Type: AWS::EC2::VPCGatewayAttachment
      Properties:
        VpcId: !Ref RenderVpc
        InternetGatewayId: !Ref RenderInternetGateway

    # Two AZs so a zonal Spot shortage doesn't stall every video render.
    RenderSubnetA:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref RenderVpc
        CidrBlock: 10.42.1.0/24
        AvailabilityZone: !Select [0, !GetAZs ""]
        MapPublicIpOnLaunch: true

    RenderSubnetB:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref RenderVpc
        CidrBlock: 10.42.2.0/24
        AvailabilityZone: !Select [1, !GetAZs ""]
        MapPublicIpOnLaunch: true

    RenderRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId: !Ref RenderVpc

    RenderDefaultRoute:
      Type: AWS::EC2::Route
      DependsOn: RenderVpcGatewayAttachment
      Properties:
        RouteTableId: !Ref RenderRouteTable
        DestinationCidrBlock: 0.0.0.0/0
        GatewayId: !Ref RenderInternetGateway

    RenderSubnetARouteAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref RenderSubnetA
        RouteTableId: !Ref RenderRouteTable

    RenderSubnetBRouteAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref RenderSubnetB
        RouteTableId: !Ref RenderRouteTable

    RenderS3Endpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: !Ref RenderVpc
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
        VpcEndpointType: Gateway
        RouteTableIds:
          - !Ref RenderRouteTable

    # Outbound only. A render task calls Firestore, the CDN and S3; nothing
    # ever needs to reach IN to it.
    RenderSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Trendly render worker tasks (egress only)
        VpcId: !Ref RenderVpc
        SecurityGroupEgress:
          - IpProtocol: "-1"
            CidrIp: 0.0.0.0/0

    # ── Roles ─────────────────────────────────────────────────────────────
    # Execution role = what Fargate itself needs (pull the image, write logs).
    # Job role = what OUR code may do (write the render to S3). Split so the
    # worker can never pull or push images.
    RenderTaskExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: ["sts:AssumeRole"]
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

    RenderTaskRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: ["sts:AssumeRole"]
        Policies:
          - PolicyName: RenderWorkerS3Write
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ["s3:PutObject"]
                  Resource: "arn:aws:s3:::${self:service}-attachment-uploads/uploads/*"

    # ── Batch (video) ─────────────────────────────────────────────────────
    # Spot first, on-demand second. Batch falls through to the second compute
    # environment when Spot capacity is short, so a render is delayed rather
    # than failed — and retried automatically when Spot reclaims a task.
    RenderComputeEnvSpot:
      Type: AWS::Batch::ComputeEnvironment
      Properties:
        Type: MANAGED
        State: ENABLED
        ComputeResources:
          Type: FARGATE_SPOT
          MaxvCpus: 64   # ~16 concurrent renders: a cap, so a bad day is bounded
          Subnets:
            - !Ref RenderSubnetA
            - !Ref RenderSubnetB
          SecurityGroupIds:
            - !GetAtt RenderSecurityGroup.GroupId

    RenderComputeEnvOnDemand:
      Type: AWS::Batch::ComputeEnvironment
      Properties:
        Type: MANAGED
        State: ENABLED
        ComputeResources:
          Type: FARGATE
          MaxvCpus: 32
          Subnets:
            - !Ref RenderSubnetA
            - !Ref RenderSubnetB
          SecurityGroupIds:
            - !GetAtt RenderSecurityGroup.GroupId

    RenderJobQueue:
      Type: AWS::Batch::JobQueue
      Properties:
        JobQueueName: RenderJobQueue-${self:provider.stage}
        Priority: 1
        State: ENABLED
        ComputeEnvironmentOrder:
          - Order: 1
            ComputeEnvironment: !Ref RenderComputeEnvSpot
          - Order: 2
            ComputeEnvironment: !Ref RenderComputeEnvOnDemand

    # 30 days: long enough to debug a render a user complains about days later,
    # short enough that a pathological design looping in FFmpeg can't bill for
    # log storage forever.
    RenderJobLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/batch/trendly-render-${self:provider.stage}
        RetentionInDays: 30

    RenderJobDefinition:
      Type: AWS::Batch::JobDefinition
      Properties:
        JobDefinitionName: RenderJobDefinition-${self:provider.stage}
        Type: container
        PlatformCapabilities: [FARGATE]
        # Retry what is worth retrying. Exit code 1 is the worker reporting a
        # design it genuinely cannot render, and burning two more attempts on it
        # only delays the error the user is waiting for. Everything else — a
        # Spot reclaim, a task that never started, an OOM kill — matches no
        # condition and so falls through to a retry, which is Batch's documented
        # behaviour when no EvaluateOnExit entry matches.
        #
        # Expressed as fall-through rather than as explicit RETRY rules because
        # Batch only accepts a wildcard at the END of OnStatusReason: a leading
        # one is rejected outright ("Evaluate on exit condition contains
        # restricted characters"), so there is no way to match a substring like
        # Spot, and no reliable prefix to match it on either.
        RetryStrategy:
          Attempts: 3
          EvaluateOnExit:
            - Action: EXIT
              OnExitCode: "1"
        Timeout:
          AttemptDurationSeconds: 1800
        ContainerProperties:
          Image: ${env:RENDER_IMAGE_URI, ''}
          # Deliberately NO Command. Batch's `command` is Docker CMD, which is
          # appended as ARGUMENTS to the image's ENTRYPOINT — and the entrypoint
          # is already `node dist/services/render-worker/src/cli.js`. Repeating
          # it here produced `node cli.js node cli.js`, so cli.js read argv[2] as
          # the literal "node" and died on JSON.parse. The job itself arrives as
          # the RENDER_JOB environment override that batch:SubmitJob sets; see
          # submitBatchJob in internal/trendlyapis/rendering/handlers.go.
          # 4 vCPU: FFmpeg scales with cores and is the back half of every video.
          ResourceRequirements:
            - Type: VCPU
              Value: "4"
            - Type: MEMORY
              Value: "8192"
          ExecutionRoleArn: !GetAtt RenderTaskExecutionRole.Arn
          JobRoleArn: !GetAtt RenderTaskRole.Arn
          # Without this Batch logs to its own /aws/batch/job group, which is
          # shared by every job in the account and — because nothing in CFN owns
          # it — never expires. A dedicated group keeps video renders findable
          # and lets the retention below actually apply. No extra IAM needed:
          # AmazonECSTaskExecutionRolePolicy already grants CreateLogStream and
          # PutLogEvents on *, and the group itself is created here because that
          # policy deliberately does NOT grant logs:CreateLogGroup.
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RenderJobLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: render
          NetworkConfiguration:
            AssignPublicIp: ENABLED
          # Graviton: same Chromium build as everywhere else (Playwright ships
          # an arm64 Linux browser), ~20% cheaper, and matches the stack's
          # provider.architecture.
          RuntimePlatform:
            CpuArchitecture: ARM64
            OperatingSystemFamily: LINUX
          Environment:
            - Name: ATTACHMENT_S3_BUCKET_NAME
              Value: ${self:service}-attachment-uploads
            - Name: ATTACHMENT_CF_DISTRIBUTION_URL
              Value: https://d1u20zdoqkyuuq.cloudfront.net
            - Name: FIRESTORE_DATABASE_ID
              Value: ${env:FIRESTORE_DATABASE_ID, '(default)'}
            - Name: FIREBASE_SERVICE_ACCOUNT_JSON
              Value: ${env:FIREBASE_SERVICE_ACCOUNT_JSON, ''}
            - Name: RENDER_SCALE
              Value: ${env:RENDER_SCALE, '1'}

    # --------------------------------------------------------------------------------------
    # ------------- Scheduled content publishing (delayed_sqs via Step Functions) ----------
    # --------------------------------------------------------------------------------------
    ContentPublishQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ContentPublishQueue-${self:provider.stage}
        VisibilityTimeout: 960   # ≥ scheduled_publish_sqs timeout (900s, Lambda max) + buffer

    ContentPublishStateMachineRole:
      Type: AWS::IAM::Role
      Properties:
        Path: !Join ["", ["/", !Ref "AWS::StackName", "/"]]
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Action: ["sts:AssumeRole"]
              Principal:
                Service:
                  - !Sub "states.${AWS::Region}.amazonaws.com"
        Policies:
          - PolicyName: "ContentPublishSendToSQS"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action: ["sqs:SendMessage"]
                  Resource: { "Fn::GetAtt": ["ContentPublishQueue", "Arn"] }

    ContentPublishStateMachine:
      Type: "AWS::StepFunctions::StateMachine"
      Properties:
        StateMachineName: ContentPublishDelayedSQS-${self:provider.stage}
        RoleArn: !GetAtt ContentPublishStateMachineRole.Arn
        DefinitionString: |
          {
            "StartAt": "Delay",
            "Comment": "Publish to SQS after a delay (scheduled content publishing)",
            "States": {
              "Delay": {
                "Type": "Wait",
                "SecondsPath": "$.delay_seconds",
                "Next": "Send message to SQS"
              },
              "Send message to SQS": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sqs:sendMessage",
                "Parameters": {
                  "QueueUrl.$": "$.topic",
                  "MessageBody.$": "$.message"
                },
                "End": true
              }
            }
          }

    # --------------------------------------------------------------------------------------
    # ------------- S3 for Videos -----------------------------------------------------
    # --------------------------------------------------------------------------------------
    VideoUploadBucket:
      Condition: IsDev
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-video-uploads
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: ["GET", "PUT", "POST", "DELETE", "HEAD"]
              AllowedOrigins: ["*"]

    # Shared CORS policy for the asset CloudFront distributions. CloudFront
    # applies these response headers at the edge on EVERY viewer response
    # (including already-cached objects), so a crossOrigin="anonymous" request —
    # e.g. html2canvas rendering a design that embeds the brand logo — gets a
    # valid Access-Control-Allow-Origin and can rasterize the image. Without it
    # the legacy ForwardedValues below never forward the Origin header to S3, so
    # S3 never emits CORS headers and cross-origin canvas reads fail silently.
    AssetsCorsResponseHeadersPolicy:
      Condition: IsDev
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-assets-cors
          CorsConfig:
            AccessControlAllowCredentials: false
            AccessControlAllowHeaders:
              Items: ["*"]
            AccessControlAllowMethods:
              Items: ["GET", "HEAD", "OPTIONS"]
            AccessControlAllowOrigins:
              Items: ["*"]
            OriginOverride: true

    CloudFrontDistribution:
      Condition: IsDev
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Origins:
            - DomainName: {"Fn::GetAtt": ["VideoUploadBucket", "DomainName"]}
              Id: S3Origin
              OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
              S3OriginConfig: {}
                # OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}"
          DefaultCacheBehavior:
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: "redirect-to-https"
            ResponseHeadersPolicyId: !Ref AssetsCorsResponseHeadersPolicy
            AllowedMethods: ["GET", "HEAD", "OPTIONS"]
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: "none"
            MinTTL: 0
            DefaultTTL: 86400  # 1 day
            MaxTTL: 31536000  # 1 year
          ViewerCertificate:
            CloudFrontDefaultCertificate: true
          # PriceClass: "PriceClass_100"

    # CloudFront Origin Access Control (OAC)
    CloudFrontOriginAccessControl:
      Condition: IsDev
      Type: AWS::CloudFront::OriginAccessControl
      Properties:        
        OriginAccessControlConfig:
          Name: "TrendlyS3OAC"
          OriginAccessControlOriginType: "s3"
          SigningBehavior: "always"
          SigningProtocol: "sigv4"

    # S3 Bucket Policy for CloudFront
    VideoS3BucketPolicy:
      Condition: IsDev
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: ${self:service}-video-uploads
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: "s3:GetObject"
              Resource: arn:aws:s3:::${self:service}-video-uploads/*
              Condition:
                StringEquals:
                  "AWS:SourceArn": arn:aws:cloudfront::730335628944:distribution/E2SI5E1LON8KJ0
                  # {"Fn::GetAtt": ["CloudFrontDistribution", "Arn"]}

    # --------------------------------------------------------------------------------------
    # ------------- S3 for Images -----------------------------------------------------
    # --------------------------------------------------------------------------------------

    ImageUploadBucket:
      Condition: IsDev
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-image-uploads
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: ["GET", "PUT", "POST", "DELETE", "HEAD"]
              AllowedOrigins: ["*"]

    ImageCFDistribution:
      Condition: IsDev
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Origins:
            - DomainName: {"Fn::GetAtt": ["ImageUploadBucket", "DomainName"]}
              Id: S3ImageOrigin
              OriginAccessControlId: !GetAtt ImageCFOriginAccessControl.Id
              S3OriginConfig: {}
          DefaultCacheBehavior:
            TargetOriginId: S3ImageOrigin
            ViewerProtocolPolicy: "redirect-to-https"
            ResponseHeadersPolicyId: !Ref AssetsCorsResponseHeadersPolicy
            AllowedMethods: ["GET", "HEAD", "OPTIONS"]
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: "none"
            MinTTL: 0
            DefaultTTL: 86400  # 1 day
            MaxTTL: 31536000  # 1 year
          ViewerCertificate:
            CloudFrontDefaultCertificate: true
          # PriceClass: "PriceClass_100"

    # CloudFront Origin Access Control (OAC)
    ImageCFOriginAccessControl:
      Condition: IsDev
      Type: AWS::CloudFront::OriginAccessControl
      Properties:        
        OriginAccessControlConfig:
          Name: "TrendlyS3ImageOAC"
          OriginAccessControlOriginType: "s3"
          SigningBehavior: "always"
          SigningProtocol: "sigv4"
    
    # S3 Bucket Policy for CloudFront
    ImageS3BucketPolicy:
      Condition: IsDev
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: ${self:service}-image-uploads
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: "s3:GetObject"
              Resource: arn:aws:s3:::${self:service}-image-uploads/*
              Condition:
                StringEquals:
                  "AWS:SourceArn": arn:aws:cloudfront::730335628944:distribution/E2IB9GHFJLTLW8
    
    # --------------------------------------------------------------------------------------
    # ------------- S3 for Attachemnts -----------------------------------------------------
    # --------------------------------------------------------------------------------------

    AttachmentUploadBucket:
      Condition: IsDev
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-attachment-uploads
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: ["GET", "PUT", "POST", "DELETE"]
              AllowedOrigins: ["*"]

    AttachmentCFDistribution:
      Condition: IsDev
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Origins:
            - DomainName: {"Fn::GetAtt": ["AttachmentUploadBucket", "DomainName"]}
              Id: S3AttachmentOrigin
              OriginAccessControlId: !GetAtt AttachmentCFOriginAccessControl.Id
              S3OriginConfig: {}
          DefaultCacheBehavior:
            TargetOriginId: S3AttachmentOrigin
            ViewerProtocolPolicy: "redirect-to-https"
            ResponseHeadersPolicyId: !Ref AssetsCorsResponseHeadersPolicy
            AllowedMethods: ["GET", "HEAD", "OPTIONS"]
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: "none"
            MinTTL: 0
            DefaultTTL: 86400  # 1 day
            MaxTTL: 31536000  # 1 year
          ViewerCertificate:
            CloudFrontDefaultCertificate: true
          # PriceClass: "PriceClass_100"

    # CloudFront Origin Access Control (OAC)
    AttachmentCFOriginAccessControl:
      Condition: IsDev
      Type: AWS::CloudFront::OriginAccessControl
      Properties:        
